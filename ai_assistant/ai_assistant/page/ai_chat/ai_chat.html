<style>
    .ai-app-wrapper { display: flex; flex-direction: column; gap: var(--margin-md); height: calc(100vh - var(--navbar-height) - var(--page-head-height) - 28px); min-height: 620px; padding: var(--padding-md); background: var(--bg-color); }
    .ai-chat-container { display: flex; flex: 1; min-height: 0; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); overflow: hidden; }
    .ai-left-panel { width: 280px; background-color: var(--card-bg); border-right: 1px solid var(--border-color); padding: var(--padding-lg); display: flex; flex-direction: column; overflow-y: auto; }
    .panel-header { font-weight: 600; color: var(--heading-color); margin-bottom: var(--margin-sm); font-size: var(--text-base); display: flex; align-items: center; gap: var(--margin-xs); }
    .ai-setting-item { margin-bottom: var(--margin-md); }
    .ai-setting-item label { display: block; font-size: var(--text-xs); color: var(--text-muted); margin-bottom: var(--margin-xs); font-weight: 600; }
    .ai-setting-item select, .ai-setting-item input { width: 100%; height: var(--input-height); padding: 4px 8px; border: 1px solid var(--border-color); border-radius: var(--border-radius); font-size: var(--text-sm); outline: none; background: var(--control-bg); color: var(--text-color); }
    .ai-setting-item select:focus, .ai-setting-item input:focus, .chat-input:focus { border-color: var(--primary); box-shadow: var(--focus-default); }
    .ai-setting-item input[readonly] { background: var(--disabled-control-bg); color: var(--text-muted); }
    .context-tag { background-color: var(--subtle-fg); color: var(--text-color); padding: 6px 10px; border-radius: var(--border-radius); font-size: var(--text-sm); margin-bottom: var(--margin-xs); }
    .ai-panel-divider { border: 0; border-top: 1px solid var(--border-color); margin: var(--margin-md) 0; }
    .ai-panel-divider.is-dashed { border-top-style: dashed; }

    .module-nav-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--margin-sm); margin-top: var(--margin-sm); }
    .module-icon-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 72px; background: var(--control-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: var(--padding-sm); text-decoration: none; color: var(--text-color); transition: background-color 0.15s ease, border-color 0.15s ease; cursor: pointer; }
    .module-icon-btn:hover { background: var(--fg-hover-color); border-color: var(--gray-400); color: var(--heading-color); text-decoration: none; }
    .module-icon-btn .module-icon { font-size: 20px; line-height: 1; }
    .module-icon-text { font-size: var(--text-xs); font-weight: 600; margin-top: var(--margin-xs); }

    .ai-main-chat { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; background: var(--fg-color); }
    .chat-history { flex: 1; min-height: 0; padding: var(--padding-lg); overflow-y: auto; background-color: var(--fg-color); }
    .chat-message { display: flex; margin-bottom: var(--margin-md); }
    .chat-message.user { justify-content: flex-end; }
    .chat-message.ai { justify-content: flex-start; }
    .chat-bubble { max-width: min(760px, 85%); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); padding: 10px 14px; background: var(--card-bg); color: var(--text-color); font-size: var(--text-sm); line-height: 1.55; }
    .chat-message.user .chat-bubble { background: var(--primary); border-color: var(--primary); color: var(--white, #fff); }
    .chat-loading { color: var(--text-muted); font-size: var(--text-sm); }

    .quick-actions { display: flex; flex-wrap: wrap; gap: var(--margin-sm); padding: var(--padding-sm) var(--padding-lg); background-color: var(--card-bg); border-top: 1px solid var(--border-color); align-items: center; }
    .quick-btn { height: var(--btn-height); background-color: var(--control-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: var(--border-radius); font-size: var(--text-sm); color: var(--text-color); cursor: pointer; white-space: nowrap; transition: background-color 0.15s ease, border-color 0.15s ease; font-weight: 500; }
    .quick-btn:hover { background-color: var(--fg-hover-color); color: var(--heading-color); }
    .dropdown { position: relative; display: inline-block; }
    .dropdown-content { display: none; position: absolute; bottom: 100%; left: 0; background-color: var(--card-bg); min-width: 190px; max-height: 280px; overflow-y: auto; box-shadow: var(--shadow-md); z-index: 9999; border-radius: var(--border-radius-md); border: 1px solid var(--border-color); margin-bottom: var(--margin-xs); }
    .dropdown-content a { color: var(--text-color); padding: 8px 12px; text-decoration: none; display: block; font-size: var(--text-sm); transition: background-color 0.15s ease; font-weight: 400; border-bottom: 1px solid var(--border-color); }
    .dropdown-content a:last-child { border-bottom: none; }
    .dropdown-content a:hover { background-color: var(--fg-hover-color); color: var(--heading-color); text-decoration: none; }
    .dropdown.show-menu .dropdown-content { display: block; }
    .dropdown.show-menu .quick-btn { background-color: var(--fg-hover-color); }

    .chat-input-area { display: flex; gap: var(--margin-sm); padding: var(--padding-md) var(--padding-lg); background-color: var(--card-bg); border-top: 1px solid var(--border-color); }
    .chat-input { flex: 1; height: var(--input-height); padding: 4px 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius); outline: none; font-size: var(--text-sm); background: var(--control-bg); color: var(--text-color); }
    .send-btn { min-width: 72px; }
    .ai-log-panel { height: 132px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius-md); display: flex; flex-direction: column; overflow: hidden; }
    .log-header { background-color: var(--subtle-fg); padding: 8px var(--padding-md); font-weight: 600; font-size: var(--text-sm); color: var(--heading-color); border-bottom: 1px solid var(--border-color); }
    .log-content { flex: 1; padding: 10px var(--padding-md); overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: var(--text-xs); background-color: var(--gray-900); }
    .log-sys { color: var(--gray-400); } .log-success { color: var(--green-300, #9de5b3); } .log-warn { color: var(--yellow-300, #f5d76e); } .log-error { color: var(--red-300, #f8a5a5); }

    .ai-reply-content { line-height: 1.6; font-size: var(--text-sm); color: var(--text-color); }
    .ai-reply-content p { margin: 0 0 10px 0; }
    .ai-reply-content p:last-child { margin-bottom: 0; }
    .ai-reply-content strong { color: var(--heading-color); font-weight: 600; }
    .ai-reply-content ul, .ai-reply-content ol { padding-left: 20px; margin-top: 5px; margin-bottom: 10px; }
    .ai-reply-content pre { background-color: var(--gray-900); color: var(--gray-100); padding: 12px; border-radius: var(--border-radius); overflow-x: auto; margin: 10px 0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .ai-reply-content code { background-color: var(--subtle-fg); color: var(--red-600); padding: 2px 6px; border-radius: var(--border-radius); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: var(--text-xs); }
    .ai-reply-content pre code { background-color: transparent; color: inherit; padding: 0; }
    .ai-reply-content a { color: var(--primary); text-decoration: none; font-weight: 500; border-bottom: 1px solid transparent; transition: border-color 0.15s ease; }
    .ai-reply-content a:hover { border-bottom-color: var(--primary); }

    .action-export-wrap { margin-top: var(--margin-md); border-top: 1px dashed var(--border-color); padding-top: var(--padding-sm); }
    .action-export-btn, .action-upload-btn, .action-download-report-btn { display: inline-flex; align-items: center; gap: var(--margin-xs); }
    .action-upload-btn { margin-top: var(--margin-xs); }
    .action-download-report-btn { font-weight: 600; }

    @media (max-width: 991px) {
        .ai-app-wrapper { height: auto; min-height: 0; }
        .ai-chat-container { flex-direction: column; }
        .ai-left-panel { width: 100%; max-height: none; border-right: 0; border-bottom: 1px solid var(--border-color); }
        .ai-main-chat { min-height: 560px; }
    }
</style>
